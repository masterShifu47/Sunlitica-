
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunlitica | Intelligent Solar Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #FFFFFF;
        color: #0A2540;
      }
      .solar-shadow {
        box-shadow: 0 4px 20px -2px rgba(10, 37, 64, 0.08);
      }
      @keyframes pulse-soft {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      .animate-pulse-soft {
        animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* Print Optimization */
      @media print {
        @page {
          margin: 1cm;
          size: A4 portrait;
        }
        nav, footer, .no-print, button, #payment-section, .ad-unit {
          display: none !important;
        }
        body {
          background-color: white !important;
          padding: 0 !important;
          margin: 0 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        main {
          max-width: 100% !important;
          padding: 0 !important;
          margin: 0 !important;
        }
        .solar-shadow {
          box-shadow: none !important;
          border: 1px solid #eee !important;
        }
        #results-section {
          padding-top: 0 !important;
          margin-top: 0 !important;
          border: none !important;
        }
        /* Force background colors to print */
        .bg-[#0A2540] { background-color: #0A2540 !important; color: white !important; }
        .bg-[#1A1A1A] { background-color: #1A1A1A !important; color: white !important; }
        .bg-[#FDB813] { background-color: #FDB813 !important; }
        .bg-slate-50 { background-color: #f8fafc !important; }
        .text-white { color: white !important; }
      }
      
      /* PDF Capture Specifics */
      .is-generating-pdf .no-print {
        display: none !important;
      }
      .is-generating-pdf #results-section {
        padding: 20px !important;
        margin: 0 !important;
      }
      .is-generating-pdf .pdf-header-visible {
        display: flex !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@2.15.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "html2pdf.js": "https://esm.sh/html2pdf.js@0.10.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
